name: Clean snapshot identity
on:
  pull_request:
    paths:
      - 'pipeline/clean_snapshot.py'
      - 'pipeline/legal_html.py'
      - 'sistema/api/ingesta.py'
      - 'sistema/api/esquema.sql'
      - 'sistema/api/version_text.py'
      - 'sistema/api/exact_http.py'
      - 'sistema/api/access_policy.py'
      - 'sistema/api/isolated_login.py'
      - 'sistema/api/isolated_session.py'
      - 'sistema/api/demo_aislada.py'
      - 'sistema/DEMO-AISLADA.md'
      - 'sistema/api/demo_restore.py'
      - 'sistema/RECUPERACION-DEMO.md'
      - 'tests/test_clean_snapshot.py'
      - 'tests/test_clean_snapshot_sol.py'
      - 'tests/test_exact_http.py'
      - 'tests/test_access_policy.py'
      - 'tests/test_isolated_login.py'
      - 'tests/test_login_guards.py'
      - 'tests/test_isolated_session.py'
      - 'tests/test_demo_aislada.py'
      - 'tests/test_demo_restore.py'
      - '.github/workflows/clean-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stable_identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile and test copy, exact reading and isolated session lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile pipeline/clean_snapshot.py sistema/api/version_text.py sistema/api/exact_http.py sistema/api/access_policy.py sistema/api/isolated_login.py sistema/api/isolated_session.py tests/test_clean_snapshot_sol.py tests/test_exact_http.py tests/test_access_policy.py tests/test_isolated_login.py tests/test_login_guards.py tests/test_isolated_session.py
          timeout 60s python3 tests/test_clean_snapshot_sol.py
          timeout 60s python3 tests/test_exact_http.py
          timeout 60s python3 tests/test_access_policy.py
          # GuardTests inherits the original 12 login tests; do not run them twice.
          timeout 90s python3 tests/test_login_guards.py
          timeout 90s python3 tests/test_isolated_session.py
      - name: Compile and test synthetic demo CLI (real subprocess lifecycle)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile sistema/api/demo_aislada.py tests/test_demo_aislada.py
          timeout 120s python3 tests/test_demo_aislada.py
      - name: Compile and test quarantined synthetic restore
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile sistema/api/demo_restore.py tests/test_demo_restore.py
          timeout 120s python3 tests/test_demo_restore.py
