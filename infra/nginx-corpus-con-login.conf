# ============================================================================
# CORPUS LEGAL DE TARIJA · acceso CON LOGIN
#
# Orden de Abraham, 2026-09-10: "abrir corpus con login".
#
# ESTADO PREVIO: el vhost devolvia 503 en toda ruta desde las 06:29 UTC de hoy,
# porque el buscador sin login exponia nombres de partes (q=Mamani daba 1.232
# pasajes y el primero nombraba a las dos partes de una causa de violacion de un
# menor). Backup del vhost original:
#   /etc/nginx/conf.d/corpus-legal.conf.antes-del-cierre-privacidad
#   md5 a8dd458aebf7457024056cc11efb3774
#
# ATENCION, Y VA PRIMERO: **este archivo NO fue aplicado.** El taller donde se
# escribio no tiene red ni SSH a la VM, asi que no pude ni instalarlo ni correr
# `nginx -t`. Lo unico verificado aca es la LOGICA del falsador
# (`instrumentos/falsador_login_corpus.py`), probada contra cuatro escenarios
# simulados. Los cuatro pasos de abajo los tiene que disparar Abraham.
#
# ----------------------------------------------------------------------------
# APLICAR (los cuatro pasos, en este orden)
# ----------------------------------------------------------------------------
#   1. Crear el archivo de credenciales. NO uses htpasswd si no esta instalado:
#      openssl alcanza y ya esta en la VM.
#
#      printf 'abraham:%s\n' "$(openssl passwd -apr1 'LA-CLAVE-QUE-ELIJAS')" \
#        | sudo tee /etc/nginx/corpus.htpasswd >/dev/null
#      sudo chown root:www-data /etc/nginx/corpus.htpasswd
#      sudo chmod 640 /etc/nginx/corpus.htpasswd
#
#      Para agregar a un abogado despues, con -a (append) en vez de sobrescribir:
#      printf 'dr.perez:%s\n' "$(openssl passwd -apr1 'otra-clave')" \
#        | sudo tee -a /etc/nginx/corpus.htpasswd >/dev/null
#
#   2. Guardar el vhost cerrado para poder volver, e instalar este:
#      sudo cp /etc/nginx/conf.d/corpus-legal.conf \
#              /etc/nginx/conf.d/corpus-legal.conf.cerrado-503
#      sudo cp infra/nginx-corpus-con-login.conf \
#              /etc/nginx/conf.d/corpus-legal.conf
#      sudo nginx -t && sudo systemctl reload nginx
#
#   3. VERIFICAR con el falsador, que exige DOS resultados y no uno:
#      python3 instrumentos/falsador_login_corpus.py --usuario abraham --clave 'LA-CLAVE'
#      (sin credenciales -> 401 en todas las rutas; CON credenciales -> 200)
#
#   4. Cambiar el bind del backend a loopback (ver infra/bind-loopback.md).
#      Sin eso, el 8080 sigue escuchando en 0.0.0.0 y este login NO lo cubre.
#
# ----------------------------------------------------------------------------
# REVERTIR AL CIERRE TOTAL, un comando
# ----------------------------------------------------------------------------
#   sudo cp /etc/nginx/conf.d/corpus-legal.conf.cerrado-503 \
#           /etc/nginx/conf.d/corpus-legal.conf \
#     && sudo nginx -t && sudo systemctl reload nginx
#
# ----------------------------------------------------------------------------
# QUE ESTE ARCHIVO NO RESUELVE, y hay que decirlo
# ----------------------------------------------------------------------------
#   1. Basic Auth manda usuario y clave en CADA request, en base64, o sea EN
#      CLARO si la conexion no es HTTPS. El ingress de Abacus termina TLS, asi
#      que de afuera va cifrado; dentro de la red de la VM, no. Aceptable para
#      un piloto con dos o tres personas; NO es un sistema de cuentas.
#   2. NO hay usuarios por bufete, ni sesiones, ni revocacion individual mas que
#      editando el archivo. Eso lo da la API de Custos Legis (`backend/api.py`),
#      que si tiene usuarios, roles, matricula y RLS. Este login es la puerta
#      del corpus, no del producto.
#   3. **Un login NO anonimiza.** El corpus SIGUE teniendo los nombres: ahora
#      exige credencial para verlos. La compuerta que decide que texto se puede
#      mostrar esta en `custos-legis-tarija/backend/anonimizador.py`, y medido
#      deja publicable el 17,3 % del corpus. Cablearla es un trabajo aparte.
#   4. NO borra lo que otro ya copio. Si un buscador indexo paginas antes del
#      cierre, esto no las recupera. NO MEDIDO si eso paso.
# ============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/corpus;
    index index.html;

    # ---- EL LOGIN, para TODO el vhost -----------------------------------
    # Va en el `server` y no en cada `location`, a proposito: si se protege
    # /buscar y se deja /texto abierto, con un uid (que aparece en cualquier
    # resultado cacheado o indexado) se lee la causa completa. Un guard que cubre
    # una ruta y deja la hermana abierta no protege lo que dice proteger. Es la
    # misma razon por la que el cierre del 06:29 cerro TODO y no solo /buscar.
    auth_basic           "Corpus legal de Tarija - acceso restringido";
    auth_basic_user_file /etc/nginx/corpus.htpasswd;

    # Encabezados de seguridad. No son decorativos: el frontend del corpus
    # muestra texto de resoluciones y no debe quedar embebido en otro sitio.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Y que ningun buscador vuelva a indexar lo que hubo abierto.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Limite de ritmo: un login no impide que alguien CON credencial baje el
    # corpus entero. La zona se define en el http{} de nginx.conf:
    #   limit_req_zone $binary_remote_addr zone=corpus:10m rate=5r/s;
    # Si esa linea no esta, `nginx -t` FALLA y no se aplica nada. Mejor eso que
    # aplicar a medias y creer que el limite existe.
    limit_req zone=corpus burst=20 nodelay;

    # robots.txt SIN login, porque un crawler no puede autenticarse y hay que
    # poder decirle que no entre. Es la unica excepcion junto al health check, y
    # devuelve tres lineas fijas: no expone ningun dato del corpus.
    location = /robots.txt {
        auth_basic off;
        limit_req  off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\nNoindex: /\n";
    }

    # Health check del ingress, sin login y sin tocar la base.
    location = /_salud_borde {
        auth_basic off;
        limit_req  off;
        access_log off;
        default_type application/json;
        return 200 "{\"borde\":\"ok\",\"login\":\"exigido en el resto\"}";
    }

    location / {
        try_files $uri $uri/ @api;
    }

    location @api {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        # El backend NO recibe el Authorization: ya lo valido nginx, y reenviarlo
        # significaria que un bug del backend puede loguear credenciales.
        proxy_set_header   Authorization     "";
        proxy_read_timeout 60s;
    }

    # El acceso se loguea SIN query string. La query de una busqueda juridica
    # revela la estrategia de un caso, y eso no va a un archivo de texto. Misma
    # regla que el `log_message` de la API de Custos Legis.
    log_format corpus_sin_query '$remote_addr - $remote_user [$time_local] '
                               '"$request_method $uri" $status $body_bytes_sent';
    access_log /var/log/nginx/corpus-access.log corpus_sin_query;
    error_log  /var/log/nginx/corpus-error.log warn;
}
