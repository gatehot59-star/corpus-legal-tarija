name: Clean snapshot identity
on:
  pull_request:
    paths:
      - 'pipeline/clean_snapshot.py'
      - 'pipeline/legal_html.py'
      - 'sistema/api/ingesta.py'
      - 'sistema/api/esquema.sql'
      - 'sistema/api/version_text.py'
      - 'sistema/api/exact_http.py'
      - 'tests/test_clean_snapshot.py'
      - 'tests/test_clean_snapshot_sol.py'
      - 'tests/test_exact_http.py'
      - '.github/workflows/clean-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stable_identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile and test copy plus exact-version HTTP reading
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile pipeline/clean_snapshot.py sistema/api/version_text.py sistema/api/exact_http.py tests/test_clean_snapshot_sol.py tests/test_exact_http.py
          timeout 60s python3 tests/test_clean_snapshot_sol.py
          timeout 60s python3 tests/test_exact_http.py
