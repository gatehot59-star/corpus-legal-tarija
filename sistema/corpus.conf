server {
    listen 80;
    server_name corpus-tarija.vm.internal 150448fcc6.vm.internal corpus-tarija.abacusai.cloud 150448fcc6.abacusai.cloud;
    root /var/www/corpus;
    index index.html;
    client_max_body_size 8k;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = / {
        try_files /index.html =404;
    }
    location = /texto {
        proxy_pass http://127.0.0.1:8080/texto;
    }
    location = /censo {
        proxy_pass http://127.0.0.1:8080/censo;
    }
    location = /buscar {
        proxy_pass http://127.0.0.1:8080/buscar$is_args$args;
    }
    location / {
        default_type application/json;
        return 404 '{"error":"ruta desconocida","rutas":["/","/censo","/buscar","/texto"]}';
    }
}
