name: censo-gaceta-tcp

# Por que en Actions y no en brain-env: el Celeron llevaba mas de 25 min en UN
# tomo sin terminar. Aca 20 tomos y el control negativo cierran en ~1m30s.
# runs-on: ubuntu-latest (hosted). NO self-hosted: ese runner vive DENTRO de
# brain-env y ya saturo el taller una vez.
#
# La matriz se DESCUBRE del portal, no se supone: el patron de URL cambia por
# gestion (2018 plano 5 tomos, 2019 trimestral 20 tomos, 2020 y 2022 semestral
# 10 tomos). Generalizar el patron de 2022 a 2019 habria pedido 10 URLs
# inexistentes y concluido que la gestion no existe.
#
# HISTORIAL DE DEFECTOS DE ESTE INSTRUMENTO, todos MIOS y todos medidos:
#   D1 (v1->v2). v1 partia el texto SOLO por encabezado de SENTENCIA. El
#      TomoV2018 tiene 1.451 AUTOS y 84 DECLARACIONES contra 29 sentencias:
#      se perdian ~1.300 resoluciones. Ahi estaba el -36 % del cruce contra el
#      buscador, que casi atribui a que la Gaceta no publica todo.
#   D2 (v1->v2). El sufijo de sala era `[-A-Za-z0-9]*`, que acepta un guion
#      FINAL sin sala e inventa un ID fantasma ("0339/2018-").
#   D3 (v2->v3). v2 exigia "CONSTITUCIONAL PLURINACIONAL" y el TomoV2018 dio
#      cobertura 0,022: sus autos NO llevan "PLURINACIONAL". El guard nuevo lo
#      caza y el job muere, que es lo correcto. v3 hace PLURINACIONAL opcional
#      y ADEMAS imprime el encabezado real verbatim cuando el guard da rojo,
#      para no volver a adivinar el formato.
#   D4 (v2->v3). El consolidador copiaba los JSON nuevos SOBRE los viejos ya
#      commiteados. Si un tomo fallaba, quedaba su archivo de la corrida
#      anterior y el RESUMEN mezclaba dos parsers reportando 5/5 VERDES. Mi
#      propio "documento que no se entero de que el mundo cambio". v3 borra el
#      directorio antes de consolidar y exige la etiqueta de parser en cada
#      tomo.

on:
  workflow_dispatch:
    inputs:
      gestion:
        description: gestion a censar
        required: false
        default: "2022"
  push:
    paths:
      - "disparadores/censo-gaceta.txt"

permissions:
  contents: write

env:
  PARSER: v3-tipos-flexibles

jobs:
  descubrir:
    runs-on: ubuntu-latest
    outputs:
      gestion: ${{ steps.d.outputs.gestion }}
      matriz: ${{ steps.d.outputs.matriz }}
      cuantos: ${{ steps.d.outputs.cuantos }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        env:
          ENTRADA: ${{ github.event.inputs.gestion }}
        run: |
          set -uo pipefail
          GESTION="${ENTRADA}"
          if [ -z "${GESTION}" ]; then
            GESTION=$(grep -oE 'gestion:[[:space:]]*[0-9]{4}' disparadores/censo-gaceta.txt | grep -oE '[0-9]{4}' | head -1)
          fi
          if [ -z "${GESTION}" ]; then
            echo "ROJO: no pude determinar la gestion"
            exit 1
          fi
          echo "gestion=${GESTION}" >> "$GITHUB_OUTPUT"
          python3 instrumentos/descubrir_gaceta.py "${GESTION}" > matriz.json
          CUANTOS=$(python3 -c "import json;print(len(json.load(open('matriz.json'))))")
          echo "cuantos=${CUANTOS}" >> "$GITHUB_OUTPUT"
          echo "matriz=$(cat matriz.json)" >> "$GITHUB_OUTPUT"
          echo "gestion ${GESTION} | tomos descubiertos: ${CUANTOS}"
          cat matriz.json

  tomo:
    needs: descubrir
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        t: ${{ fromJson(needs.descubrir.outputs.matriz) }}
    steps:
      - uses: actions/checkout@v4

      - name: instalar poppler y pypdf
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python3 -m pip install --quiet pypdf

      - name: bajar el tomo
        env:
          URL: ${{ matrix.t.url }}
          NOMBRE: ${{ matrix.t.nombre }}
        run: |
          set -uo pipefail
          CT=$(curl -sL -o tomo.pdf -w '%{content_type}' --max-time 900 -A Mozilla/5.0 "${URL}")
          echo "content-type: ${CT}"
          ls -la tomo.pdf
          if ! echo "$CT" | grep -qi pdf; then
            echo "ROJO: ${NOMBRE} no devolvio un PDF"
            exit 1
          fi
          sha256sum tomo.pdf

      - name: extraer y censar
        env:
          NOMBRE: ${{ matrix.t.nombre }}
          URL: ${{ matrix.t.url }}
          GESTION: ${{ needs.descubrir.outputs.gestion }}
          PARSER: ${{ env.PARSER }}
        run: |
          set -uo pipefail
          pdftotext -q tomo.pdf tomo.txt || true
          if [ ! -s tomo.txt ] || [ "$(wc -c < tomo.txt)" -lt 100000 ]; then
            echo "pdftotext no sirvio, probando pypdf"
            python3 -c "import pypdf;r=pypdf.PdfReader('tomo.pdf');f=open('tomo.txt','w');[f.write(p.extract_text() or '') for p in r.pages];f.close()"
          fi
          python3 - <<'PY'
          import hashlib, json, os, re
          nombre = os.environ["NOMBRE"]
          gestion = os.environ["GESTION"]
          txt = open("tomo.txt", encoding="utf-8", errors="replace").read()

          # v3: PLURINACIONAL OPCIONAL. Medido: los autos del TomoV2018 no lo
          # llevan, y exigirlo dejaba ese tomo en cobertura 0,022.
          TIPO = r"(SENTENCIA|AUTO|DECLARACI[O\u00d3]N)\s+CONSTITUCIONAL(?:\s+PLURINACIONAL)?"
          NUM = r"([0-9]{1,4}/[0-9]{4})(-[A-Za-z0-9]+)?"
          ENC = re.compile(TIPO + r"\s+" + NUM)
          SIGLA = {"SENTENCIA": "SCP", "AUTO": "ACP", "DECLARACION": "DCP"}

          def ident(m):
              crudo = m.group(1).upper().replace("\u00d3", "O")
              return SIGLA.get(crudo, crudo[:3]) + " " + m.group(2) + (m.group(3) or "")

          todos = set()
          por_tipo = {}
          for m in ENC.finditer(txt):
              i = ident(m)
              todos.add(i)
              k = i.split()[0]
              por_tipo[k] = por_tipo.get(k, 0) + 1

          # atribuir cada Tarija a SU resolucion, partiendo por CUALQUIER
          # encabezado. Sin grupo de captura en el lookahead: re.split con
          # captura devuelve tambien los grupos y ensucia la lista.
          tarija = set()
          TIPO_NC = TIPO.replace("(SENTENCIA", "(?:SENTENCIA")
          for p in re.split(r"(?=" + TIPO_NC + r")", txt):
              m = ENC.search(p)
              if m and re.search(r"Departamento:\s*Tarija", p):
                  tarija.add(ident(m))

          campo = len(re.findall(r"Departamento:", txt))
          out = {
              "parser": os.environ["PARSER"],
              "gestion": gestion,
              "tomo": nombre,
              "url": os.environ["URL"],
              "sha256_pdf": hashlib.sha256(open("tomo.pdf", "rb").read()).hexdigest(),
              "bytes_pdf": os.path.getsize("tomo.pdf"),
              "caracteres": len(txt),
              "resoluciones_unicas": len(todos),
              "encabezados_por_tipo": por_tipo,
              "tarija_resoluciones": sorted(tarija),
              "tarija_total": len(tarija),
              "campo_departamento": campo,
          }
          cobertura = len(todos) / max(1, campo)
          out["cobertura_encabezado_vs_campo"] = round(cobertura, 3)
          if len(todos) == 0 or campo == 0:
              out["veredicto"] = "ROJO_SIN_TEXTO_UTIL"
          elif cobertura < 0.5:
              out["veredicto"] = "ROJO_PARSER_PIERDE_RESOLUCIONES"
          else:
              out["veredicto"] = "VERDE"

          # DIAGNOSTICO cuando el guard da rojo: el encabezado real, verbatim.
          # Sin esto hay que adivinar el formato, y ya adivine mal una vez.
          if out["veredicto"] != "VERDE":
              muestras = []
              for m in re.finditer(r"(?:AUTO|SENTENCIA|DECLARACI)[^\n]{0,90}", txt):
                  s = " ".join(m.group(0).split())
                  if s not in muestras:
                      muestras.append(s)
                  if len(muestras) >= 8:
                      break
              out["muestras_de_encabezado"] = muestras

          json.dump(out, open(nombre + ".json", "w"), ensure_ascii=False, indent=1)
          liviano = {k: v for k, v in out.items() if k != "tarija_resoluciones"}
          print(json.dumps(liviano, indent=1, ensure_ascii=False))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### " + nombre + chr(10) + "```json" + chr(10) +
                      json.dumps(liviano, indent=1, ensure_ascii=False) + chr(10) + "```" + chr(10))
          if out["veredicto"] != "VERDE":
              raise SystemExit("GUARD ROJO: " + nombre + " -> " + out["veredicto"])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: censo-${{ matrix.t.nombre }}
          path: ${{ matrix.t.nombre }}.json
          retention-days: 14
          if-no-files-found: warn

  control-negativo:
    needs: descubrir
    runs-on: ubuntu-latest
    steps:
      - name: un tomo que no puede existir
        env:
          GESTION: ${{ needs.descubrir.outputs.gestion }}
        run: |
          set -uo pipefail
          CT=$(curl -sL -o falso.pdf -w '%{content_type}' --max-time 120 -A Mozilla/5.0 \
            "https://tcpbolivia.bo/wp-content/uploads/2025/03/TomoXXinventado${GESTION}.pdf" || true)
          echo "content-type: ${CT}"
          ls -la falso.pdf || true
          if echo "$CT" | grep -qi pdf && [ "$(wc -c < falso.pdf)" -gt 100000 ]; then
            echo "ALERTA: el servidor devolvio un PDF para un tomo inventado."
            echo "Los 200 de esta corrida NO valen."
            exit 1
          fi
          echo "CONTROL NEGATIVO OK: el inventado no devuelve PDF"

  juntar:
    needs: [descubrir, tomo, control-negativo]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bajados
          pattern: censo-Tomo*
          merge-multiple: true
      - name: consolidar y commitear
        env:
          GESTION: ${{ needs.descubrir.outputs.gestion }}
          ESPERADOS: ${{ needs.descubrir.outputs.cuantos }}
          PARSER: ${{ env.PARSER }}
        run: |
          set -uo pipefail
          DIR="mediciones/gaceta-${GESTION}"
          # D4: borrar antes de copiar. Si un tomo falla, su archivo de la
          # corrida anterior NO debe sobrevivir y contaminar el resumen.
          rm -rf "${DIR}"
          mkdir -p "${DIR}"
          cp bajados/*.json "${DIR}/" 2>/dev/null || true
          ls -la "${DIR}/"
          python3 - <<'PY'
          import glob, json, os
          gestion = os.environ["GESTION"]
          parser = os.environ["PARSER"]
          esperados = int(os.environ.get("ESPERADOS") or 0)
          d = "mediciones/gaceta-" + gestion
          filas = [json.load(open(p)) for p in sorted(glob.glob(d + "/Tomo*.json"))]
          # D4: ningun tomo de otro parser entra al resumen
          ajenos = [f["tomo"] for f in filas if f.get("parser") != parser]
          verdes = [f for f in filas if f.get("veredicto") == "VERDE" and f.get("parser") == parser]
          rojos = [{"tomo": f["tomo"], "veredicto": f.get("veredicto"),
                    "cobertura": f.get("cobertura_encabezado_vs_campo"),
                    "muestras": f.get("muestras_de_encabezado")}
                   for f in filas if f.get("veredicto") != "VERDE"]
          todas, donde = set(), {}
          for f in verdes:
              for r in f.get("tarija_resoluciones", []):
                  donde.setdefault(r, []).append(f["tomo"])
                  todas.add(r)
          dobles = {r: v for r, v in donde.items() if len(v) > 1}
          tipos = {}
          for f in verdes:
              for k, v in (f.get("encabezados_por_tipo") or {}).items():
                  tipos[k] = tipos.get(k, 0) + v
          res = {
              "gestion": gestion,
              "parser": parser,
              "tomos_descubiertos": esperados,
              "tomos_medidos": len(filas),
              "tomos_verdes": len(verdes),
              "tomos_rojos": rojos,
              "tomos_de_otro_parser_descartados": ajenos,
              "encabezados_por_tipo": tipos,
              "resoluciones_unicas_sumadas": sum(f.get("resoluciones_unicas", 0) for f in verdes),
              "tarija_resoluciones_unicas": len(todas),
              "tarija_sumado_por_tomo": sum(f["tarija_total"] for f in verdes),
              "caracteres_total": sum(f["caracteres"] for f in verdes),
              "repetidas_entre_tomos": dobles,
              "tarija_listado": sorted(todas),
              "por_tomo": [
                  {k: f.get(k) for k in ("tomo", "parser", "resoluciones_unicas", "tarija_total",
                                          "campo_departamento", "cobertura_encabezado_vs_campo",
                                          "caracteres", "bytes_pdf", "sha256_pdf", "veredicto")}
                  for f in filas
              ],
          }
          res["completo"] = (esperados > 0 and len(verdes) == esperados and not ajenos)
          if not res["completo"]:
              res["ADVERTENCIA"] = ("censo PARCIAL: %d verdes de %d descubiertos"
                                    % (len(verdes), esperados))
          res["sin_solapamiento"] = (len(dobles) == 0)
          json.dump(res, open(d + "/RESUMEN.json", "w"), ensure_ascii=False, indent=1)
          liviano = {k: v for k, v in res.items() if k not in ("tarija_listado", "por_tomo")}
          print(json.dumps(liviano, indent=1, ensure_ascii=False))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## RESUMEN " + gestion + chr(10) + "```json" + chr(10) +
                      json.dumps(liviano, indent=1, ensure_ascii=False) + chr(10) + "```" + chr(10))
          PY
          git config user.name "gaceta-ci"
          git config user.email "ci@mudh.local"
          git pull --rebase --autostash || true
          git add -A "${DIR}"
          git commit -m "censo(gaceta ${GESTION}): parser ${PARSER}, JSON por tomo + RESUMEN" || echo "nada que commitear"
          git push || echo "push fallo"
