# ============================================================================
# CORPUS LEGAL TARIJA - ACCESO PUBLICO CERRADO
# Fecha: 2026-09-10 - Orden de Jorge Abraham Mendieta
#
# MOTIVO, medido y con evidencia cruda:
#   GET /buscar?q=Mamani                              -> 1.232 pasajes
#   primer resultado, uid jur-tar-auto-supremo-as-0099-2013-2013-e6c79f3b:
#     "Ministerio Publico y Richard Mamani Correa contra Ramon Mamani
#      Delito: Violacion de Nino, Nina o Adolescente, con agravante y Rapto
#      Propio. Recurso: Casacion."
#   GET /buscar?q=Violacion+de+Nino+Nina+o+Adolescente -> 484 pasajes
#
# El buscador publico SIN AUTENTICACION exponia nombres de partes en causas
# penales, incluidas causas con victimas menores. Eso es proteccion de datos
# (CPE art. 130) antes que derecho de autor, y el riesgo lo levanto una
# auditoria externa (Fable 5.1) como hipotesis: se midio y se confirmo.
#
# POR QUE SE CIERRA TODO Y NO SOLO /buscar:
#   /texto?uid=&nro= devuelve el DOCUMENTO COMPLETO. Cerrar la busqueda y dejar
#   la lectura abierta seria un guard que no protege lo que dice proteger: con
#   un uid (que aparece en cualquier resultado ya cacheado o indexado por un
#   buscador) se sigue leyendo la causa entera.
#   Tampoco se sirve /estado: publica los conteos, y no hay razon para exponer
#   metricas de un servicio cerrado.
#
# QUE NO SE TOCA:
#   - corpus-api sigue corriendo en 127.0.0.1:8080, accesible solo por SSH.
#   - la base rag-abogacia-v7.db no se modifica.
#   - /var/www/corpus queda intacto: solo deja de servirse.
#   Cerrar no es borrar. Esto es reversible en un comando.
#
# REVERTIR:
#   sudo cp /etc/nginx/conf.d/corpus-legal.conf.antes-del-cierre-privacidad \
#           /etc/nginx/conf.d/corpus-legal.conf \
#     && sudo nginx -t && sudo systemctl reload nginx
#
# FALSADOR DEL CIERRE (tiene que dar 503 y CERO nombres):
#   curl -s -o /dev/null -w '%{http_code}\n' https://150448fcc6.abacusai.cloud/
#   curl -s 'https://150448fcc6.abacusai.cloud/buscar?q=Mamani' | grep -c Mamani
# ============================================================================
server {
    listen 80;
    server_name corpus-tarija.vm.internal 150448fcc6.vm.internal corpus-tarija.abacusai.cloud 150448fcc6.abacusai.cloud;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Sin `root` ni `index` a proposito: nada de /var/www/corpus se sirve.
    # Sin ningun proxy_pass: el backend queda inalcanzable desde afuera.
    location / {
        default_type application/json;
        return 503 '{"estado":"CERRADO","motivo":"acceso publico suspendido por revision de privacidad","detalle":"El corpus contiene nombres de partes en causas penales. Se suspende el acceso hasta resolver la anonimizacion.","fecha":"2026-09-10"}';
    }
}
